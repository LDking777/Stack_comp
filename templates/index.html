<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REVENGE - AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>

    <div class="ai-widget-container">
      <div id="ai-chat-window" class="ai-chat-window hidden">
        
        <div class="ai-chat-topbar">
          <div class="ai-chat-avatar">🤖</div>
          <div class="ai-chat-info">
            <div class="ai-chat-name">REVENGE AI</div>
            <div class="ai-chat-status" id="ai-status">🟢 En línea</div>
          </div>
          
          <button id="ai-toggle-speaker" class="ai-speaker-btn muted" title="Activar voz de la IA">
            <i class="fa-solid fa-volume-xmark" id="speaker-icon"></i>
          </button>

          <button id="ai-chat-close" class="ai-chat-close">✖</button>
        </div>

        <div class="ai-chat-messages" id="ai-chat-messages">
          <div class="ai-msg bot">
            <div class="ai-msg-avatar">🤖</div>
            <div class="ai-msg-content">
              <div class="ai-msg-bubble">¡Hola! Soy REVENGE AI. Estoy listo para ayudarte. <b>¡Ganaremos la hackathon!</b> 🏆</div>
              <div class="ai-msg-time">ahora</div>
            </div>
          </div>
        </div>

        <div class="ai-chat-input-bar">
          <button type="button" id="ai-chat-mic" class="ai-mic-btn muted" title="Grabar audio">
            <i class="fa-solid fa-microphone-slash" id="mic-icon"></i>
          </button>

          <textarea id="ai-chat-input" placeholder="Escribe tu mensaje aquí..." rows="1"></textarea>

          <button type="button" id="ai-chat-send">➤</button>
        </div>
      </div>

      <button id="ai-chat-toggle" class="ai-chat-toggle" title="Habla con nuestra IA">
        🤖
      </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/scripts.js"></script>
  </body>
</html>
