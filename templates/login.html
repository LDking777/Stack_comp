<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - REVENGE AI</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    
    <link rel="stylesheet" href="/static/login.css" />
  </head>

  <body class="forest-bg min-h-screen flex items-center justify-center px-4 py-8">

    <div class="glass-card fade-up w-full max-w-md rounded-3xl px-8 py-10 sm:px-12 sm:py-14">
      
      <div class="flex flex-col items-center mb-10">
        <div class="bg-white/20 w-16 h-16 rounded-full flex items-center justify-center mb-4 border border-white/40">
          <i class="fa-brands fa-telegram text-white text-3xl"></i>
        </div>
        <h1 class="text-white text-3xl font-bold text-center tracking-tight drop-shadow-lg">
          REVENGE AI
        </h1>
        <p class="text-white/60 text-sm mt-1 uppercase tracking-widest font-medium">Panel de Control</p>
      </div>

      {% if error %}
      <div class="mb-6 flex items-center gap-3 bg-red-500/30 border border-red-400/50 text-white text-sm py-3 px-5 rounded-2xl fade-up">
        <i class="fa-solid fa-circle-exclamation text-red-200"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="/login" method="POST" class="flex flex-col gap-5">
        
        <div class="relative">
          <input type="text" name="user_name" placeholder="Usuario de Administrador" class="pill-input w-full rounded-full py-4 pl-6 pr-12 text-base" required autocomplete="off" />
          <i class="fa-solid fa-user absolute right-5 top-1/2 -translate-y-1/2 text-white/40"></i>
        </div>

        <div class="relative">
          <input type="password" name="password" placeholder="Contraseña" class="pill-input w-full rounded-full py-4 pl-6 pr-12 text-base" required />
          <i class="fa-solid fa-lock absolute right-5 top-1/2 -translate-y-1/2 text-white/40"></i>
        </div>

        <button type="submit" class="mt-4 w-full bg-white text-gray-900 font-bold py-4 rounded-full hover:bg-gray-100 transform active:scale-95 transition-all duration-200 shadow-xl">
          INICIAR SESIÓN
        </button>
      </form>

    </div>

    <script src="/static/login.js"></script>
  </body>
</html>
